# Format: window-invisible <role> <agent> <worktree> [task|batch] [forward-only|back-one|back-all] [extra-cli-args...]
# The optional receive mode defaults to task. Use batch for roles that should
# consume all currently queued equal-priority handoffs as one batch.
# The optional propagation token defaults to forward-only. Use back-one or
# back-all to queue merge-only copies to earlier windows.
# Any fields after those tokens are passed to the agent CLI, e.g. --yolo.
#
# This fork runs grok, not codex (issue #38), and deliberately carries no
# --yolo: extra-args-prefix splices those tokens straight into the grok command
# line, grok has no --yolo flag, and swarmforge.bb's grok-permission-prefix
# already passes --permission-mode bypassPermissions for every grok row. The
# --yolo upstream added here is a codex/copilot flag that yolo-flag supplies on
# its own anyway.
window-invisible coder grok master
window-invisible cleaner grok cleaner batch back-one
