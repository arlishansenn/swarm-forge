# Format: window-invisible <role> <agent> <worktree> [task|batch] [forward-only|back-one|back-all] [extra-cli-args...]
# The optional receive mode defaults to task. Use batch for roles that should
# consume all currently queued equal-priority handoffs as one batch.
# The optional propagation token defaults to forward-only. Use back-one or
# back-all to queue merge-only copies to earlier windows.
# Any fields after those tokens are passed to the agent CLI, e.g. --yolo.
# Grok yolo is --permission-mode bypassPermissions, added by the launcher.
#
# Every role runs grok here (issue #38). upstream's b933d68 splits this pack —
# specifier/architect/QA on grok, coder/cleaner/hardender back on Codex — and
# that split is NOT taken: issue #38 moved this fork to grok deliberately, the
# other two Packs are all-grok after the same sync, and a merge is the wrong
# place to change which agent runs a role. Revisit it as its own decision, with
# a reason, not as a side effect of following upstream.
#
# No --yolo on any row, for the reason upstream's own comment above gives: it
# is a codex/copilot flag, and grok's permission bypass already comes from
# swarmforge.bb's grok-permission-prefix.
window-invisible specifier grok master
window-invisible coder grok coder
window-invisible cleaner grok cleaner batch back-one
window-invisible architect grok architect batch back-all
window-invisible hardender grok hardender batch
window-invisible QA grok QA batch back-all
