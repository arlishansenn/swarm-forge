schema: intent-driven

context: |
  本仓库是 unclebob/swarm-forge 的 fork，长期跟随它的 main，同时保留自己的一批
  修复与功能。OpenSpec 在这里的首要用途是：把「本 fork 相对 upstream 的每条有意
  差异」记成可验收的 spec，而不是只留一份散文清单。upstream merge 之后照 spec
  逐条验，而不是靠人回忆重做一遍。

  所有 OpenSpec 文档（proposal、design、tasks、specs、adr）使用简体中文；
  technical term、命令、路径、identifier 保持英文原文，不创建中文译名。
  Gherkin 关键词（WHEN / THEN / AND）保持英文。

rules:
  proposal:
    - 使用简体中文；technical term 保持英文原文。
    - 若本提案与 upstream 的差异有关，Why 一节必须点名是哪次事故或哪个 issue 促成的。
  specs:
    - 使用简体中文叙述；Gherkin 关键词与 technical term 保持英文。
    - 每条 requirement 至少一个 scenario，scenario 标题用四个 #。
    - 描述本 fork 相对 upstream 的差异时，scenario 必须写成「换成 upstream 的版本就会失败」的形状——判据是可证伪，不是可阅读。
  design:
    - 使用简体中文；technical term 保持英文原文。
    - 写之前先读 adr/ 下全部 ADR，按 Supersedes 链算出当前仍然在效的那一组。
  adr:
    - 使用简体中文；technical term 保持英文原文。
    - ADR 一经 accepted 即不可修改；要改结论就新写一条并在 Supersedes 里点名旧的。
  tasks:
    - 使用简体中文；technical term 保持英文原文。
    - 动过 openspec/ 内 spec 的工作：spec 与 code 分 commit（tasks.md 豁免）。
